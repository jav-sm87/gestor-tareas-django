{% extends "core/base.html" %}
{% block titulo %}Eliminar proyecto{% endblock %}
{% block contenido %}
<div class="card" style="max-width:500px;">
    <h1>Eliminar proyecto</h1>
    <p>¿Seguro que deseas eliminar el proyecto <strong>{{ proyecto.nombre }}</strong>? Esta acción también eliminará sus tareas asociadas.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-peligro">Sí, eliminar</button>
        <a class="btn btn-secundario" href="{% url 'proyecto_detalle' proyecto.pk %}">Cancelar</a>
    </form>
</div>
{% endblock %}
